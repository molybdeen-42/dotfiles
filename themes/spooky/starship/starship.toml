# Spooky theme

format = """
$username@$hostname\
$directory\
$git_branch\
$character
"""

right_format = "$cmd_duration$status$jobs$time"

scan_timeout = 10

[username]
format = "[$user]($style)"
style_user = "bold #d16b4f"
style_root = "bold #b83a3a"
show_always = true

[hostname]
format = "[$hostname]($style):"
style = "bold #b83a3a"
ssh_only = false

[directory]
format = "[ $path/ ]($style)"
style = "bold #a85546"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "at [$branch(:$remote_branch) ]($style)"
style = "bold #e8a87c"

[character]
success_symbol = "[❯](brblue)"
error_symbol = "[❯](brred)"

[time]
disabled = false
style = "#8a8fa8"
format = "[$time]($style) "
time_format = "%H:%M:%S"

[cmd_duration]
min_time = 2000
style = "#d16b4f"
format = "took [$duration]($style) "

[status]
disabled = false
style = "#b83a3a"
format = "[$symbol $maybe_status]($style) "

[jobs]
threshold = 1
symbol = "⚙ "
style = "#d16b4f"
format = "[$number$symbol]($style)"
